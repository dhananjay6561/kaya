use_default_settings:
  engines:
    keep_only:
      - google
      - bing
      - duckduckgo
      - startpage
      - wikipedia

general:
  instance_name: kaya

server:
  limiter: false
  public_instance: false
  image_proxy: false

outgoing:
  request_timeout: 5.0

search:
  safe_search: 0
  formats:
    - html
    - json

engines:
  - name: google
    disabled: false
  - name: bing
    disabled: false
  - name: duckduckgo
    disabled: false
  - name: startpage
    disabled: false
  - name: wikipedia
    disabled: false
