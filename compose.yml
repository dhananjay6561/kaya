name: kaya

x-service: &service
  restart: unless-stopped
  read_only: true
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  depends_on:
    migrate:
      condition: service_completed_successfully

x-database-url: &database-url postgres://${POSTGRES_USER:-kaya}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@db:5432/${POSTGRES_DB:-kaya}

services:
  db:
    image: pgvector/pgvector:0.8.7-pg18-trixie@sha256:ab49524d18df7200b74ac9a475e1db6297fc1eb57da4c214c63d10ecc4b754fa
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-kaya}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-kaya}
    volumes:
      - ${DATA_DIR:-./data}/postgres:/var/lib/postgresql
    shm_size: 256mb
    healthcheck:
      test: ["CMD-SHELL", 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 20s

  migrate:
    image: ghcr.io/amacneil/dbmate:2.38.2@sha256:fb4fe7cabfe98cf864d63ce083867f3c303a8c1a022fcd69081439425706e909
    command: ["--wait", "--wait-timeout", "60s", "up"]
    user: "65532:65532"
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-kaya}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@db:5432/${POSTGRES_DB:-kaya}?sslmode=disable
      DBMATE_MIGRATIONS_DIR: /db/migrations
      DBMATE_NO_DUMP_SCHEMA: "true"
    volumes:
      - ./db/migrations:/db/migrations:ro
    depends_on:
      db:
        condition: service_healthy

  gateway:
    <<: *service
    build:
      context: gateway
      args:
        VERSION: ${VERSION:-dev}
    environment:
      LOG_LEVEL: ${LOG_LEVEL:-info}
      GATEWAY_PORT: ${GATEWAY_PORT:-3001}
      DATABASE_URL: *database-url
      DATA_DIR: /data
      LISTEN_HOST: 0.0.0.0
    healthcheck:
      test: ["CMD", "/gateway", "healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

  core:
    <<: *service
    build:
      context: .
      dockerfile: core/Dockerfile
      args:
        VERSION: ${VERSION:-dev}
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: *database-url
      DATA_DIR: /data
      LISTEN_HOST: 0.0.0.0
    healthcheck:
      test: ["CMD", "/nodejs/bin/node", "dist/healthcheck.js"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
