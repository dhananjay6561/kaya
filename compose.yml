name: kaya

x-service: &service
  restart: unless-stopped
  stop_grace_period: 15s
  read_only: true
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  depends_on:
    db-roles:
      condition: service_completed_successfully

services:
  db:
    image: pgvector/pgvector:0.8.7-pg18-trixie@sha256:ab49524d18df7200b74ac9a475e1db6297fc1eb57da4c214c63d10ecc4b754fa
    restart: unless-stopped
    # Postgres must not be PID 1: a health check whose shell exits first leaves pg_isready to be
    # reaped by PID 1, and a postmaster that reaps a child it did not start, exiting non-zero,
    # treats it as a crashed backend and restarts every connection into crash recovery.
    init: true
    security_opt:
      - no-new-privileges:true
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-kaya}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-kaya}
    volumes:
      - ${DATA_DIR:-./data}/postgres:/var/lib/postgresql
    shm_size: 256mb
    healthcheck:
      test: ["CMD-SHELL", 'pg_isready -h 127.0.0.1 -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 20s

  migrate:
    image: ghcr.io/amacneil/dbmate:2.38.2@sha256:fb4fe7cabfe98cf864d63ce083867f3c303a8c1a022fcd69081439425706e909
    command: ["--wait", "--wait-timeout", "60s", "up"]
    user: "65532:65532"
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-kaya}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@db:5432/${POSTGRES_DB:-kaya}?sslmode=disable
      TEST_DATABASE_URL: postgres://${POSTGRES_USER:-kaya}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@db:5432/kaya_schema_test?sslmode=disable
      DBMATE_MIGRATIONS_DIR: /db/migrations
      DBMATE_NO_DUMP_SCHEMA: "true"
      DBMATE_STRICT: "true"
    volumes:
      - ./db/migrations:/db/migrations:ro
    depends_on:
      db:
        condition: service_healthy

  db-roles:
    image: pgvector/pgvector:0.8.7-pg18-trixie@sha256:ab49524d18df7200b74ac9a475e1db6297fc1eb57da4c214c63d10ecc4b754fa
    user: postgres
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    entrypoint:
      ["psql", "--no-psqlrc", "--quiet", "--set", "ON_ERROR_STOP=1", "--file", "/db/roles.sql"]
    environment:
      PGHOST: db
      PGUSER: ${POSTGRES_USER:-kaya}
      PGPASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      PGDATABASE: ${POSTGRES_DB:-kaya}
      GATEWAY_DB_PASSWORD: ${GATEWAY_DB_PASSWORD:?set GATEWAY_DB_PASSWORD in .env}
      CORE_DB_PASSWORD: ${CORE_DB_PASSWORD:?set CORE_DB_PASSWORD in .env}
    volumes:
      - ./db/roles.sql:/db/roles.sql:ro
    depends_on:
      migrate:
        condition: service_completed_successfully

  gateway:
    <<: *service
    build:
      context: .
      dockerfile: gateway/Dockerfile
      args:
        VERSION: ${VERSION:-dev}
    environment:
      LOG_LEVEL: ${LOG_LEVEL:-info}
      GATEWAY_PORT: ${GATEWAY_PORT:-3001}
      DATABASE_URL: postgres://kaya_gateway:${GATEWAY_DB_PASSWORD:?set GATEWAY_DB_PASSWORD in .env}@db:5432/${POSTGRES_DB:-kaya}
      DATA_DIR: /data
      LISTEN_HOST: 0.0.0.0
      MEDIA_MAX_BYTES: ${MEDIA_MAX_BYTES:-}
      MEDIA_MAX_PER_HOUR: ${MEDIA_MAX_PER_HOUR:-}
    volumes:
      - ${DATA_DIR:-./data}/gateway:/data
    healthcheck:
      test: ["CMD", "/gateway", "healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

  searxng:
    image: searxng/searxng:2026.11.26-b5605b8f2@sha256:462d8dbeadd7c7c304be08d47084f5caba70f47a9145a01fd25990a7944e61b7
    restart: unless-stopped
    stop_grace_period: 15s
    user: "977:977"
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    environment:
      SEARXNG_SECRET: ${SEARXNG_SECRET:?set SEARXNG_SECRET in .env}
    volumes:
      - ./services/searxng/settings.yml:/etc/searxng/settings.yml:ro
    tmpfs:
      - /var/cache/searxng:uid=977,gid=977
      - /tmp
    healthcheck:
      test: ["CMD", "/usr/local/searxng/.venv/bin/python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/healthz', timeout=4)"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s

  core:
    <<: *service
    build:
      context: .
      dockerfile: core/Dockerfile
      args:
        VERSION: ${VERSION:-dev}
    environment:
      LOG_LEVEL: ${LOG_LEVEL:-info}
      CORE_PORT: ${CORE_PORT:-3000}
      TIMEZONE: ${TIMEZONE:-}
      DATABASE_URL: postgres://kaya_core:${CORE_DB_PASSWORD:?set CORE_DB_PASSWORD in .env}@db:5432/${POSTGRES_DB:-kaya}
      LLM_PROVIDER: ${LLM_PROVIDER:-}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GROQ_MODEL_HEAVY: ${GROQ_MODEL_HEAVY:-}
      GROQ_MODEL_ROUTINE: ${GROQ_MODEL_ROUTINE:-}
      GROQ_CONTEXT_TOKENS: ${GROQ_CONTEXT_TOKENS:-}
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_MODEL_HEAVY: ${LLM_MODEL_HEAVY:-}
      LLM_MODEL_ROUTINE: ${LLM_MODEL_ROUTINE:-}
      LLM_CONTEXT_TOKENS: ${LLM_CONTEXT_TOKENS:-}
      LLM_LOCALITY: ${LLM_LOCALITY:-}
      LLM_REASONING_EFFORT: ${LLM_REASONING_EFFORT:-}
      LLM_TOKEN_FACTOR: ${LLM_TOKEN_FACTOR:-}
      ROUTINE_LLM_PROVIDER: ${ROUTINE_LLM_PROVIDER:-}
      ROUTINE_LLM_BASE_URL: ${ROUTINE_LLM_BASE_URL:-}
      ROUTINE_LLM_API_KEY: ${ROUTINE_LLM_API_KEY:-}
      ROUTINE_LLM_MODEL: ${ROUTINE_LLM_MODEL:-}
      ROUTINE_LLM_CONTEXT_TOKENS: ${ROUTINE_LLM_CONTEXT_TOKENS:-}
      ROUTINE_LLM_LOCALITY: ${ROUTINE_LLM_LOCALITY:-}
      ROUTINE_LLM_REASONING_EFFORT: ${ROUTINE_LLM_REASONING_EFFORT:-}
      ROUTINE_LLM_TOKEN_FACTOR: ${ROUTINE_LLM_TOKEN_FACTOR:-}
      TRANSCRIBE_BASE_URL: ${TRANSCRIBE_BASE_URL:-}
      TRANSCRIBE_API_KEY: ${TRANSCRIBE_API_KEY:-}
      TAGGING_TOKENS_PER_DAY: ${TAGGING_TOKENS_PER_DAY:-}
      EMBEDDINGS_PROVIDER: ${EMBEDDINGS_PROVIDER:-}
      VOYAGE_API_KEY: ${VOYAGE_API_KEY:-}
      VOYAGE_MODEL: ${VOYAGE_MODEL:-}
      CHAT_CHANNEL: ${CHAT_CHANNEL:-}
      TELEPHONY_PROVIDER: ${TELEPHONY_PROVIDER:-}
      DATA_DIR: /data
      MEDIA_DIR: /media
      GROQ_MODEL_TRANSCRIBE: ${GROQ_MODEL_TRANSCRIBE:-whisper-large-v3-turbo}
      WEB_SEARCH_URL: ${WEB_SEARCH_URL-http://searxng:8080}
      LISTEN_HOST: 0.0.0.0
    volumes:
      - ${DATA_DIR:-./data}/core:/data
      - ${DATA_DIR:-./data}/gateway/media:/media:ro
    healthcheck:
      test: ["CMD", "/core", "healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
