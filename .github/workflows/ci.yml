name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres: &test-postgres
        image: pgvector/pgvector:0.8.7-pg18-trixie@sha256:ab49524d18df7200b74ac9a475e1db6297fc1eb57da4c214c63d10ecc4b754fa
        env:
          POSTGRES_USER: kaya
          POSTGRES_PASSWORD: kaya
          POSTGRES_DB: kaya
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U kaya -d kaya"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://kaya:kaya@localhost:5432/kaya
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: make lint-core typecheck test-core build-core

  gateway:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres: *test-postgres
    env:
      TEST_DATABASE_URL: postgres://kaya:kaya@localhost:5432/kaya?sslmode=disable
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: gateway/go.mod
          cache-dependency-path: gateway/go.sum
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.15.0
          working-directory: gateway
      - run: make test-gateway build-gateway

  core-go:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres: *test-postgres
    env:
      TEST_DATABASE_URL: postgres://kaya:kaya@localhost:5432/kaya?sslmode=disable
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: core-go/go.mod
          cache-dependency-path: |
            core-go/go.sum
            kit/go.sum
            contracts/go.sum
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.15.0
          working-directory: core-go
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.15.0
          working-directory: kit
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.15.0
          working-directory: contracts
      - run: make test-core-go test-kit build-core-go

  compose:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: the mac override parses
        run: POSTGRES_PASSWORD=x GATEWAY_DB_PASSWORD=x CORE_DB_PASSWORD=x docker compose -f compose.yml -f compose.mac.yml config --quiet
      - name: write a test .env
        run: |
          cp .env.example .env
          sed -i 's/^COMPOSE_FILE=.*/COMPOSE_FILE=compose.yml/; s/^GROQ_API_KEY=.*/GROQ_API_KEY=ci-placeholder/' .env
      - run: docker compose up --build --detach --wait --wait-timeout 180
      - name: migrations rerun as a no-op, roll back, reapply, and pass the schema tests
        run: make test-db
      - if: failure()
        run: docker compose logs
      - if: always()
        run: docker compose down --volumes

  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/dependency-review-action@bbc44d14a204704ccc493733616cd1e93a0321ec # v5.0.1
        with:
          fail-on-severity: high
